<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>七夕·秦彻·女书</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 阶段零：开屏介绍 -->
        <section id="phase0" class="screen active">
            <img src="assets/intro.png" class="intro-bg" alt="七夕乞巧">
            <button id="enterBtn" class="btn floating-bottom-btn">指尖描红</button>
        </section>

        <!-- 阶段一：描红与展示 (分为秦、彻两步) -->
        <section id="phase1" class="screen hidden" style="opacity: 0;">
            <div class="floating-title" id="hintContainer"></div>
            <div class="canvas-container">
                <img id="templateImage" src="assets/template1.png" alt="描红底图">
                <canvas id="drawingBoard"></canvas>
            </div>
            <div class="floating-btn-group horizontal" id="tracingBtnGroup">
                <button id="clearBtn" class="btn">重描</button>
                <button id="checkBtn" class="btn">描红完成</button>
            </div>
        </section>

        <!-- 阶段二：署名与同音字选择 -->
        <section id="phase2" class="screen hidden" style="opacity: 0;">
            <div class="input-container">
                <p>请输入你的名字</p>
                <input type="text" id="nameInput" placeholder="输入姓名，最多4个字" maxlength="4">
                <button id="convertBtn" class="btn" style="margin-top: 15px;">转换女书</button>
                <div id="mappingArea" class="mapping-area"></div>
                <button id="generateBtn" class="btn hidden">落笔</button>
            </div>
        </section>

        <!-- 阶段三：结缘全屏展示与拆解 -->
        <section id="phase3" class="screen hidden" style="opacity: 0;">
            <img src="assets/cp-bg.png" class="poster-main-design" id="posterBg">
            <div class="poster-content double-column">
                <div class="column qinche-column">
                    <div class="nushu-text" id="qincheNushu"></div>
                    <div class="chinese-text">秦彻</div>
                </div>
                <div class="column user-column">
                    <div class="nushu-text" id="nushuOutput"></div>
                    <div class="chinese-text" id="chineseOutput"></div>
                </div>
            </div>
            <div class="floating-btn-group horizontal poster-btns">
                <button id="deconstructBtn" class="btn">拆解</button>
                <button id="goBlessingBtn" class="btn hidden">寄语</button>
            </div>
        </section>

        <!-- ② 阶段四：寄语长河 -->
        <section id="phase4" class="screen hidden" style="opacity: 0;">
            <img src="assets/river.png" class="intro-bg fade-bg" id="riverBg" style="opacity: 0;">

            <!-- ② 句子改为"以女书寄女性"，双列竖排预览 -->
            <div id="blessingInputArea" class="input-container blessing-layout">
                <p>以女书寄女性</p>
                <input type="text" id="blessingInput" placeholder="最多10个字..." maxlength="10">
                <!-- ② 女书列 + 汉字列 -->
                <div class="blessing-bilingual" id="blessingBilingual">
                    <div class="blessing-nushu-col" id="blessingNushuCol"></div>
                    <div class="blessing-zh-col"   id="blessingZhCol"></div>
                </div>
                <!-- 保留旧 id 以防 JS 引用 -->
                <div id="blessingPreview" class="blessing-preview"></div>
            </div>

            <!-- ③ 寄出按钮绝对定位 bottom:8% -->
            <button id="sendBlessingBtn" class="btn">寄出</button>

            <div id="waterFlowContainer"></div>
            <!-- ⑤ 涟漪 SVG 层 -->
            <svg id="rippleOverlay" xmlns="http://www.w3.org/2000/svg"></svg>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
